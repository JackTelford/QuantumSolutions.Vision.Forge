# Continuous integration: type check, house-rule lint, schema drift, license
# allowlist and unit tests on Windows and Ubuntu, Node 24 (required) and
# Node 26 (informational: stripper drift is seen early, ADR 0001).
# Actions are pinned by full commit SHA; the trailing comment names the tag
# and docs/evidence/m0/ci-actions.md records how each SHA was resolved
# (checkout and setup-node at v7 after the first run warned that v4 targets
# the retired Node 20 action runtime).
# Runners are pinned to the windows-2025 and ubuntu-24.04 images, not the
# -latest labels, so an image migration is a deliberate change recorded there.
# workflow_dispatch lets a run be repeated by hand without a new commit.
# No secrets, no deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Node 26 is informational until it is proven: its failure does not fail the workflow.
    continue-on-error: ${{ matrix.node == '26' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
        node: ['24', '26']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Windows: the Gyan full build through the SHA-pinned setup-ffmpeg
      # action (apt-get on ubuntu-24.04 hung on the first run and choco is
      # slow; docs/evidence/m0/ci-actions.md).
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6 # v3.1
        with:
          ffmpeg-version: release
          github-token: ${{ github.token }}

      # Linux: the static build the action offers (johnvansickle 7.0.2) has no
      # drawtext filter, so the BtbN GPL build is taken from one pinned
      # release and checked against the SHA-256 GitHub publishes for the asset
      # (docs/evidence/m0/ci-actions.md records how both were read).
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-26-14-25/ffmpeg-n8.1.3-24-g92611900bb-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: d113aa5b57ab0dcfee171d835240ce3ea5db826a0ee80ed7528c8d26a61e87a4
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/ffmpeg/ffmpeg.tar.xz" "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg/ffmpeg.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/ffmpeg/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"

      - name: Report tool versions
        shell: bash
        run: |
          node --version
          npm --version
          ffmpeg -version | head -n 1

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --ignore-scripts

      - name: Type check
        shell: bash
        run: |
          npm run typecheck

      - name: Lint house rules
        shell: bash
        run: |
          npm run lint

      - name: Check generated types against the schemas
        shell: bash
        run: |
          npm run schema:check

      - name: Check dependency licenses
        shell: bash
        run: |
          npm run licenses

      - name: Test
        shell: bash
        run: |
          npm test
