# Continuous integration: type check, house-rule lint, schema drift, license
# allowlist and unit tests on Windows and Ubuntu, Node 24 (required) and
# Node 26 (informational: stripper drift is seen early, ADR 0001).
# Actions are pinned by full commit SHA; the trailing comment names the tag
# and docs/evidence/m0/ci-actions.md records how each SHA was resolved
# (checkout and setup-node at v7 after the first run warned that v4 targets
# the retired Node 20 action runtime).
# Runners are pinned to the windows-2025 and ubuntu-24.04 images, not the
# -latest labels, so an image migration is a deliberate change recorded there.
# workflow_dispatch lets a run be repeated by hand without a new commit.
# No secrets, no deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Node 26 is informational until it is proven: its failure does not fail the workflow.
    continue-on-error: ${{ matrix.node == '26' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
        node: ['24', '26']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # A static ffmpeg build from GitHub releases on both runners: apt-get on
      # ubuntu-24.04 hung on the first run and choco is slow; the action is
      # pinned by commit SHA (docs/evidence/m0/ci-actions.md).
      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6 # v3.1
        with:
          ffmpeg-version: release
          github-token: ${{ github.token }}

      - name: Report tool versions
        shell: bash
        run: |
          node --version
          npm --version
          ffmpeg -version | head -n 1

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --ignore-scripts

      - name: Type check
        shell: bash
        run: |
          npm run typecheck

      - name: Lint house rules
        shell: bash
        run: |
          npm run lint

      - name: Check generated types against the schemas
        shell: bash
        run: |
          npm run schema:check

      - name: Check dependency licenses
        shell: bash
        run: |
          npm run licenses

      - name: Test
        shell: bash
        run: |
          npm test
